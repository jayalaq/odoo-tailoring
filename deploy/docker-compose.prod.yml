version: '3.8'

services:
  odoo-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tailoring-erp
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ../custom-addons:/opt/odoo/custom-addons
    environment:
      - HOST=odoo-db
      - PORT=5432
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    networks:
      - tailoring-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo-db:
    image: postgres:16
    container_name: tailoring-erp-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailoring-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: tailoring-erp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - odoo-web
    restart: always
    networks:
      - tailoring-network

  certbot:
    image: certbot/certbot
    container_name: tailoring-erp-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - tailoring-network

volumes:
  odoo-data:
  db-data:

networks:
  tailoring-network:
    driver: bridge
